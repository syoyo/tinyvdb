name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:

  # ---------------------------------------------------------------------------
  #  Linux x64
  # ---------------------------------------------------------------------------
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DTINYVDB_BUILD_TVDBVIEW=OFF -DTINYVDB_BUILD_TESTS=ON \
            -DTINYVDB_BUILD_GPU=OFF -DTINYVDB_OPENMP=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Verify binaries
        run: |
          test -x ./build/vdbdump
          test -x ./build/vdbrender
      - name: Run CPU regressions at one and eight threads
        run: |
          OMP_NUM_THREADS=1 ctest --test-dir build --output-on-failure
          OMP_NUM_THREADS=8 ctest --test-dir build --output-on-failure
      - name: Read maintained fixtures
        run: |
          ./build/vdbdump data/sphere-div1.vdb
          ./build/vdbdump data/sphere-div2.vdb

  # ---------------------------------------------------------------------------
  #  Linux arm64 (cross-compile)
  # ---------------------------------------------------------------------------
  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DTINYVDB_BUILD_TVDBVIEW=OFF \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Verify binaries exist
        run: file build/vdbdump build/vdbrender

  # ---------------------------------------------------------------------------
  #  macOS arm64
  # ---------------------------------------------------------------------------
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Verify binaries
        run: |
          test -x ./build/vdbdump
          test -x ./build/vdbrender
      - name: Read maintained fixture
        run: ./build/vdbdump data/sphere-div1.vdb

  # ---------------------------------------------------------------------------
  #  Windows x64 (MSVC)
  # ---------------------------------------------------------------------------
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Verify binaries
        run: |
          dir build\Release\*.exe
      - name: Read maintained fixture
        run: |
          .\build\Release\vdbdump.exe data/sphere-div1.vdb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ---------------------------------------------------------------------------
  #  Windows arm64 (MSVC cross-compile)
  # ---------------------------------------------------------------------------
  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -A ARM64
      - name: Build
        run: cmake --build build --config Release
      - name: Verify binaries
        run: |
          dir build\Release\*.exe

  # Native SDF task backends, including libdispatch on Apple hardware.
  sdf-threading:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: C11
          - os: ubuntu-latest
            backend: PTHREAD
          - os: ubuntu-latest
            backend: NONE
          - os: macos-latest
            backend: GCD
          - os: macos-latest
            backend: PTHREAD
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure SDF tests
        run: |
          cmake -S . -B build-sdf -DCMAKE_BUILD_TYPE=Release \
            -DTINYVDB_THREAD_BACKEND=${{ matrix.backend }} \
            -DTINYVDB_BUILD_TESTS=ON -DTINYVDB_BUILD_GPU=OFF \
            -DTINYVDB_BUILD_EXAMPLES=OFF -DTINYVDB_BUILD_VDBRENDER=OFF \
            -DTINYVDB_OPENMP=OFF
      - name: Build SDF tests
        run: cmake --build build-sdf --parallel 4
      - name: Run CPU regressions
        run: ctest --test-dir build-sdf --output-on-failure
