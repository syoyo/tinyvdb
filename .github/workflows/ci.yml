name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:

  # ---------------------------------------------------------------------------
  #  Linux x64
  # ---------------------------------------------------------------------------
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DTINYVDB_BUILD_TVDBVIEW=OFF -DTINYVDB_BUILD_TESTS=ON \
            -DTINYVDB_BUILD_GPU=OFF -DTINYVDB_OPENMP=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Verify binaries
        run: |
          test -x ./build/vdbdump
          test -x ./build/vdbrender
      - name: Run CPU regressions at one and eight threads
        run: |
          OMP_NUM_THREADS=1 ctest --test-dir build --output-on-failure
          OMP_NUM_THREADS=8 ctest --test-dir build --output-on-failure
      - name: Read maintained fixtures
        run: |
          ./build/vdbdump data/sphere-div1.vdb
          ./build/vdbdump data/sphere-div2.vdb

  # ---------------------------------------------------------------------------
  #  Linux arm64 (cross-compile)
  # ---------------------------------------------------------------------------
  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DTINYVDB_BUILD_TVDBVIEW=OFF \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Verify binaries exist
        run: file build/vdbdump build/vdbrender

  # ---------------------------------------------------------------------------
  #  macOS arm64
  # ---------------------------------------------------------------------------
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Verify binaries
        run: |
          test -x ./build/vdbdump
          test -x ./build/vdbrender
      - name: Read maintained fixture
        run: ./build/vdbdump data/sphere-div1.vdb

  # ---------------------------------------------------------------------------
  #  Windows x64 (MSVC)
  # ---------------------------------------------------------------------------
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Verify binaries
        run: |
          dir build\Release\*.exe
      - name: Read maintained fixture
        run: |
          .\build\Release\vdbdump.exe data/sphere-div1.vdb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ---------------------------------------------------------------------------
  #  Windows arm64 (MSVC cross-compile)
  # ---------------------------------------------------------------------------
  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -A ARM64
      - name: Build
        run: cmake --build build --config Release
      - name: Verify binaries
        run: |
          dir build\Release\*.exe

  # ---------------------------------------------------------------------------
  #  Windows via llvm-mingw (Linux-hosted clang cross-compile)
  #
  #  Builds with the Windows clang front end and UCRT on a Linux runner, so a
  #  clang/Windows portability error fails here in about a minute instead of
  #  only on the macOS and Windows runners. x86_64 also runs the CTest suite
  #  under Wine (GPU tests skip: Wine exposes no Vulkan or CUDA driver);
  #  aarch64 has no emulator, so it is build-only with tests off (the test
  #  fixture is generated by a just-built executable, which needs one).
  # ---------------------------------------------------------------------------
  windows-llvm-mingw:
    name: windows-llvm-mingw (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            processor: AMD64
            tests: 'ON'
            pe_machine: x86-64
          - arch: aarch64
            processor: ARM64
            tests: 'OFF'
            pe_machine: Aarch64
    env:
      LLVM_MINGW_VERSION: '20260616'
      LLVM_MINGW_SHA256: 534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda
      # Quiet Wine. All steps share the default prefix (~/.wine): the fixture
      # rule runs it during the build, then the test suite and the fixture read.
      WINEDEBUG: '-all'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install llvm-mingw
        run: |
          name="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${name}.tar.xz"
          echo "${LLVM_MINGW_SHA256}  ${RUNNER_TEMP}/llvm-mingw.tar.xz" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xJf "${RUNNER_TEMP}/llvm-mingw.tar.xz"
          echo "${RUNNER_TEMP}/${name}/bin" >> "${GITHUB_PATH}"
      - name: Install Wine
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64
      - name: Report toolchain versions
        run: |
          ${{ matrix.arch }}-w64-mingw32-clang --version
          cmake --version
      - name: Configure
        run: |
          # Linking statically keeps the .exe files runnable under Wine without
          # copying runtime DLLs. CMAKE_CROSSCOMPILING_EMULATOR is also what
          # lets the test-fixture rule run the executable it just built.
          emulator=""
          if [ "${{ matrix.arch }}" = "x86_64" ]; then emulator="-DCMAKE_CROSSCOMPILING_EMULATOR=wine"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -DCMAKE_C_COMPILER=${{ matrix.arch }}-w64-mingw32-clang \
            -DCMAKE_CXX_COMPILER=${{ matrix.arch }}-w64-mingw32-clang++ \
            -DCMAKE_RC_COMPILER=${{ matrix.arch }}-w64-mingw32-windres \
            -DCMAKE_EXE_LINKER_FLAGS=-static \
            -DTINYVDB_BUILD_TVDBVIEW=OFF \
            -DTINYVDB_BUILD_TESTS=${{ matrix.tests }} \
            ${emulator}
      - name: Build
        run: cmake --build build
      - name: Verify binaries
        run: |
          file build/vdbdump.exe build/vdbrender.exe
          file build/vdbdump.exe | grep -q "PE32+ executable.*${{ matrix.pe_machine }}"
      - name: Run CPU regressions under Wine
        if: matrix.arch == 'x86_64'
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
      - name: Read maintained fixture under Wine
        if: matrix.arch == 'x86_64'
        run: wine ./build/vdbdump.exe data/sphere-div1.vdb

  # Native SDF task backends, including libdispatch on Apple hardware.
  sdf-threading:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: C11
          - os: ubuntu-latest
            backend: PTHREAD
          - os: ubuntu-latest
            backend: NONE
          - os: macos-latest
            backend: GCD
          - os: macos-latest
            backend: PTHREAD
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure SDF tests
        run: |
          cmake -S . -B build-sdf -DCMAKE_BUILD_TYPE=Release \
            -DTINYVDB_THREAD_BACKEND=${{ matrix.backend }} \
            -DTINYVDB_BUILD_TESTS=ON -DTINYVDB_BUILD_GPU=OFF \
            -DTINYVDB_BUILD_EXAMPLES=OFF -DTINYVDB_BUILD_VDBRENDER=OFF \
            -DTINYVDB_OPENMP=OFF
      - name: Build SDF tests
        run: cmake --build build-sdf --parallel 4
      - name: Run CPU regressions
        run: ctest --test-dir build-sdf --output-on-failure

  # ---------------------------------------------------------------------------
  #  Web / WASM module (Emscripten, single-threaded)
  #
  #  Nothing else in this workflow builds web/, which is how it rotted: a
  #  duplicate-symbol link failure and a missing thread-pool dependency both sat
  #  unbroken for months. The runtime test also pins the two properties that a
  #  native build cannot check -- the module must stay single-threaded (no
  #  SharedArrayBuffer, so no COOP/COEP headers needed to serve it) and must stay
  #  numerically identical to the native scalar build.
  # ---------------------------------------------------------------------------
  web-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          # Pinned to the version this was validated against. Bump deliberately.
          version: 4.0.14
      - name: Report toolchain versions
        run: |
          emcc --version | head -1
          node --version
      - name: Build WASM module
        run: ./web/build.sh Release
      - name: Verify module artifacts
        run: |
          test -s web/build-wasm/tinyvdb.js
          test -s web/build-wasm/tinyvdb.wasm
      - name: Run WASM runtime tests
        run: node web/test_wasm_smoke.js
