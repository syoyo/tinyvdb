name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  #  Linux x64
  # ---------------------------------------------------------------------------
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTINYVDBIO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Run vdbdump on data files
        run: |
          for f in data/*.vdb; do
            echo "--- $f ---"
            ./build/vdbdump "$f"
          done

  # ---------------------------------------------------------------------------
  #  Linux arm64
  # ---------------------------------------------------------------------------
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTINYVDBIO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Run vdbdump on data files
        run: |
          for f in data/*.vdb; do
            echo "--- $f ---"
            ./build/vdbdump "$f"
          done

  # ---------------------------------------------------------------------------
  #  Linux RISC-V  (via RISE RISC-V runners)
  # ---------------------------------------------------------------------------
  linux-riscv:
    runs-on: ubuntu-24.04-riscv64-2core-8gb
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTINYVDBIO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Run vdbdump on data files
        run: |
          for f in data/*.vdb; do
            echo "--- $f ---"
            ./build/vdbdump "$f"
          done

  # ---------------------------------------------------------------------------
  #  macOS arm64
  # ---------------------------------------------------------------------------
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTINYVDBIO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Run vdbdump on data files
        run: |
          for f in data/*.vdb; do
            echo "--- $f ---"
            ./build/vdbdump "$f"
          done

  # ---------------------------------------------------------------------------
  #  Windows x64 (MSVC)
  # ---------------------------------------------------------------------------
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -A x64 -DTINYVDBIO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Run vdbdump on data files
        shell: bash
        run: |
          for f in data/*.vdb; do
            echo "--- $f ---"
            ./build/Release/vdbdump.exe "$f"
          done

  # ---------------------------------------------------------------------------
  #  Windows arm64 (MSVC cross-compile)
  # ---------------------------------------------------------------------------
  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -A ARM64 -DTINYVDBIO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Verify binaries exist
        run: dir build\Release\*.exe
