name: Build wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:

  build-wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (Linux aarch64)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: pip install cibuildwheel abi3audit

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
      - name: Verify stable ABI
        run: >-
          python -c "import glob, subprocess;
          wheels = glob.glob('wheelhouse/*.whl'); assert wheels;
          [subprocess.run(['abi3audit', '--strict', '--summary', wheel], check=True) for wheel in wheels]"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and a wheel from the sdist
        run: |
          pip install build pytest numpy twine abi3audit
          python -m build
      - name: Test installed source-distribution wheel and metadata
        run: |
          pip install dist/*.whl
          python -m pytest python/tests -x
          python -m twine check --strict dist/*
          abi3audit --strict --summary dist/*.whl

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test newer-header wheel on minimum Python runtime
        run: |
          pip install pytest numpy dist/*.whl
          python -m pytest python/tests -x

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      attestations: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/tinyvdb/

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
